authors = [
    { name = "Debajyoti", email = "debuhazra96@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "langchain-groq>=1.1.3",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "opentelemetry-sdk>=1.45.2",
    "openwakeword>=0.4.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "trafilatura>=2.3.1",
